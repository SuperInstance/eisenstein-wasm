[package]
name = "eisenstein-wasm"
version = "0.1.0"
edition = "2021"
description = "Eisenstein integer arithmetic for WebAssembly — exact hex grid operations"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
eisenstein = "0.3"
wasm-bindgen = "0.2"

[profile.release]
lto = true
opt-level = "z"
strip = true
